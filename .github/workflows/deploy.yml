name: 发布研发导航
# 内容地图+产物示例：真实点击测试通过后才能上线
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'skills/**'
      - 'templates/project/**'
      - 'scripts/build_site.py'
      - 'scripts/audit_contracts.py'
      - 'scripts/smoke_ui.cjs'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 校验前端脚本语法
        run: node --check docs/app.js
      - name: 校验交互测试脚本语法
        run: node --check scripts/smoke_ui.cjs
      - name: 执行15项对抗场景校验
        run: python3 tests/run_regression.py
      - name: 构建单文件网站
        run: python3 scripts/build_site.py
      - name: 安装页面交互验证依赖
        run: npm install --no-save --no-package-lock --prefix /tmp/dev-workflow-ui-test jsdom@26
      - name: 验证实际点击与Skill目录预览
        run: node scripts/smoke_ui.cjs
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传静态网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 发布GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
