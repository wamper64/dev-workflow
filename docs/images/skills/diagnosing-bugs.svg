<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-label="diagnosing-bugs的执行流程图"><rect width="1400" height="750" fill="#f8fafc"/><rect x="24" y="24" width="1352" height="125" rx="22" fill="#0f172a"/><text x="62" y="80" fill="#fff" font-size="32" font-weight="700" font-family="sans-serif">Bug 六阶段诊断与修复（按需）</text><text x="62" y="119" fill="#bfdbfe" font-size="18" font-family="sans-serif">diagnosing-bugs · 按 Skill 规则执行 · 不是已完成证明</text><rect x="38" y="171" width="1324" height="70" rx="16" fill="#dbeafe"/><text x="65" y="197" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">核心目标</text><text x="65" y="220" fill="#334155" font-size="18" font-family="sans-serif">先用一个能抓住用户原始症状的快速红灯反馈环，再分六阶段诊断，不能靠读代码猜Bug。</text><rect x="40" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="305" r="22" fill="#2563eb"/><text x="73" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">1</text><text x="104" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">1 建红灯反馈环</text><text x="63" y="361" fill="#475569" font-size="16" font-family="sans-serif">能捕获用户原始Bug的真实快速命令</text><path d="M347,349 H369" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M364,342 L371,349 L364,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="377" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="305" r="22" fill="#2563eb"/><text x="410" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">2</text><text x="441" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">2 复现并最小化</text><text x="400" y="361" fill="#475569" font-size="16" font-family="sans-serif">保留真正触发异常的最小数据/路径</text><path d="M684,349 H706" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M701,342 L708,349 L701,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="714" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="747" cy="305" r="22" fill="#2563eb"/><text x="747" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">3</text><text x="778" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">3 列3–5个假设</text><text x="737" y="361" fill="#475569" font-size="16" font-family="sans-serif">排序、可证伪预测并先展示给用户</text><path d="M1021,349 H1043" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M1038,342 L1045,349 L1038,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="1051" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="1084" cy="305" r="22" fill="#2563eb"/><text x="1084" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">4</text><text x="1115" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">4 单变量插桩</text><text x="1074" y="361" fill="#475569" font-size="16" font-family="sans-serif">调试器/定点日志，性能先测量</text><rect x="40" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="492" r="22" fill="#2563eb"/><text x="73" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">5</text><text x="104" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">5 最小修复与回归</text><text x="63" y="548" fill="#475569" font-size="16" font-family="sans-serif">正确接缝红→绿，并重跑最初反馈环</text><path d="M347,536 H369" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M364,529 L371,536 L364,543" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="377" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="492" r="22" fill="#2563eb"/><text x="410" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">6</text><text x="441" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">6 清理与复测</text><text x="400" y="548" fill="#475569" font-size="16" font-family="sans-serif">删调试痕迹，记录根因，按人工原用例复测</text><rect x="38" y="667" width="1324" height="58" rx="14" fill="#e2e8f0"/><text x="65" y="689" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">审核与回退</text><text x="65" y="714" fill="#334155" font-size="17" font-family="sans-serif">原始故障反馈环转绿、回归成立且所有调试痕迹已清理？</text></svg>