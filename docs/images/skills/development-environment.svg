<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-label="development-environment的执行流程图"><rect width="1400" height="750" fill="#f8fafc"/><rect x="24" y="24" width="1352" height="125" rx="22" fill="#0f172a"/><text x="62" y="80" fill="#fff" font-size="32" font-weight="700" font-family="sans-serif">初次部署配置：逐环境预填、确认后执行</text><text x="62" y="119" fill="#bfdbfe" font-size="18" font-family="sans-serif">development-environment · 按 Skill 规则执行 · 不是已完成证明</text><rect x="38" y="171" width="1324" height="70" rx="16" fill="#fef3c7"/><text x="65" y="197" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">核心目标</text><text x="65" y="220" fill="#334155" font-size="18" font-family="sans-serif">先读取既有八节配置 → 各环境自动预填 → 分别确认 → 只部署基础服务 → 各环境实测与记录。</text><rect x="40" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="305" r="22" fill="#b45309"/><text x="73" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">1</text><text x="104" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">核对模板与部署包</text><text x="63" y="361" fill="#475569" font-size="16" font-family="sans-serif">八节原配置、8.1提示词及现有脚本/服务</text><path d="M347,349 H369" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><path d="M364,342 L371,349 L364,356" fill="none" stroke="#b45309" stroke-width="3"/><rect x="377" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="305" r="22" fill="#b45309"/><text x="410" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">2</text><text x="441" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">识别环境并预填</text><text x="400" y="361" fill="#475569" font-size="16" font-family="sans-serif">依PRD/S03-S05每环境复制一份，不</text><text x="400" y="382" fill="#475569" font-size="16" font-family="sans-serif">改原模板</text><path d="M684,349 H706" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><path d="M701,342 L708,349 L701,356" fill="none" stroke="#b45309" stroke-width="3"/><rect x="714" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="747" cy="305" r="22" fill="#b45309"/><text x="747" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">3</text><text x="778" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">解决缺口与冲突</text><text x="737" y="361" fill="#475569" font-size="16" font-family="sans-serif">逐环境推荐、待确认、隔离与安全检查</text><path d="M1021,349 H1043" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><path d="M1038,342 L1045,349 L1038,356" fill="none" stroke="#b45309" stroke-width="3"/><rect x="1051" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="1084" cy="305" r="22" fill="#b45309"/><text x="1084" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">4</text><text x="1115" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">逐环境人工确认</text><text x="1074" y="361" fill="#475569" font-size="16" font-family="sans-serif">全部字段及授权，未确认绝不SSH</text><rect x="40" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="492" r="22" fill="#b45309"/><text x="73" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">5</text><text x="104" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">按8.1首次执行</text><text x="63" y="548" fill="#475569" font-size="16" font-family="sans-serif">复核已有容器和端口，仅启动批准的基础服务</text><path d="M347,536 H369" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><path d="M364,529 L371,536 L364,543" fill="none" stroke="#b45309" stroke-width="3"/><rect x="377" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="492" r="22" fill="#b45309"/><text x="410" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">6</text><text x="441" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">真实验收与记录</text><text x="400" y="548" fill="#475569" font-size="16" font-family="sans-serif">本机+异机端口验证，写环境专属README</text><rect x="38" y="667" width="1324" height="58" rx="14" fill="#e2e8f0"/><text x="65" y="689" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">审核与回退</text><text x="65" y="714" fill="#334155" font-size="17" font-family="sans-serif">每个环境的完整配置得到明确确认且真实部署包支持吗？</text></svg>