<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-label="module-discovery的执行流程图"><rect width="1400" height="750" fill="#f8fafc"/><rect x="24" y="24" width="1352" height="125" rx="22" fill="#0f172a"/><text x="62" y="80" fill="#fff" font-size="32" font-weight="700" font-family="sans-serif">全项目模块拆分（Matt Tickets 适配）</text><text x="62" y="119" fill="#bfdbfe" font-size="18" font-family="sans-serif">module-discovery · 按 Skill 规则执行 · 不是已完成证明</text><rect x="38" y="171" width="1324" height="70" rx="16" fill="#dbeafe"/><text x="65" y="197" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">核心目标</text><text x="65" y="220" fill="#334155" font-size="18" font-family="sans-serif">依据业务责任、生命周期、Owner和可验收结果划分；10模块仅评审阈值，无页面能力也要归属，module_key稳定不随排序</text><text x="65" y="241" fill="#334155" font-size="18" font-family="sans-serif">变化。</text><rect x="40" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="305" r="22" fill="#2563eb"/><text x="73" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">1</text><text x="104" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">场景发现</text><text x="63" y="361" fill="#475569" font-size="16" font-family="sans-serif">PRD角色×核心场景→可验收业务能力</text><path d="M347,349 H369" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M364,342 L371,349 L364,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="377" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="305" r="22" fill="#2563eb"/><text x="410" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">2</text><text x="441" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">职责/生命周期拆合</text><text x="400" y="361" fill="#475569" font-size="16" font-family="sans-serif">共同目标、对象状态、规则和独立结果</text><path d="M684,349 H706" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M701,342 L708,349 L701,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="714" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="747" cy="305" r="22" fill="#2563eb"/><text x="747" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">3</text><text x="778" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">权威Owner与架构</text><text x="737" y="361" fill="#475569" font-size="16" font-family="sans-serif">继承S04组件、S05数据、code原型</text><path d="M1021,349 H1043" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M1038,342 L1045,349 L1038,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="1051" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="1084" cy="305" r="22" fill="#2563eb"/><text x="1084" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">4</text><text x="1115" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">依赖分析</text><text x="1074" y="361" fill="#475569" font-size="16" font-family="sans-serif">强阻塞/契约并行/外部阻塞→DAG</text><rect x="40" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="492" r="22" fill="#2563eb"/><text x="73" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">5</text><text x="104" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">业务反向覆盖</text><text x="63" y="548" fill="#475569" font-size="16" font-family="sans-serif">查漏补、无依据删、归属冲突改</text><path d="M347,536 H369" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M364,529 L371,536 L364,543" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="377" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="492" r="22" fill="#2563eb"/><text x="410" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">6</text><text x="441" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">Quiz/双角色审核</text><text x="400" y="548" fill="#475569" font-size="16" font-family="sans-serif">粒度、Owner、阻塞确认后输出模块池</text><rect x="38" y="667" width="1324" height="58" rx="14" fill="#e2e8f0"/><text x="65" y="689" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">审核与回退</text><text x="65" y="714" fill="#334155" font-size="17" font-family="sans-serif">核心场景都有唯一主责、模块职责清楚且DAG强依赖有依据吗？</text></svg>