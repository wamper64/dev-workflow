<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-label="handoff的执行流程图"><rect width="1400" height="750" fill="#f8fafc"/><rect x="24" y="24" width="1352" height="125" rx="22" fill="#0f172a"/><text x="62" y="80" fill="#fff" font-size="32" font-weight="700" font-family="sans-serif">工作区通用 · 会话交接</text><text x="62" y="119" fill="#bfdbfe" font-size="18" font-family="sans-serif">handoff · 按 Skill 规则执行 · 不是已完成证明</text><rect x="38" y="171" width="1324" height="70" rx="16" fill="#dbeafe"/><text x="65" y="197" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">核心目标</text><text x="65" y="220" fill="#334155" font-size="18" font-family="sans-serif">跨工具、跨目录、跨协作者交接时只携带必要上下文</text><rect x="40" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="305" r="22" fill="#2563eb"/><text x="73" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">1</text><text x="104" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">步骤 1</text><text x="63" y="361" fill="#475569" font-size="16" font-family="sans-serif">识别目标接力任务</text><path d="M347,349 H369" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M364,342 L371,349 L364,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="377" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="305" r="22" fill="#2563eb"/><text x="410" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">2</text><text x="441" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">步骤 2</text><text x="400" y="361" fill="#475569" font-size="16" font-family="sans-serif">引用现有Spec/ADR/Commit，而</text><text x="400" y="382" fill="#475569" font-size="16" font-family="sans-serif">非重复复制</text><path d="M684,349 H706" stroke="#2563eb" strok