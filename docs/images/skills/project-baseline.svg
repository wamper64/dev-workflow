<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-label="project-baseline的执行流程图"><rect width="1400" height="750" fill="#f8fafc"/><rect x="24" y="24" width="1352" height="125" rx="22" fill="#0f172a"/><text x="62" y="80" fill="#fff" font-size="32" font-weight="700" font-family="sans-serif">项目基线</text><text x="62" y="119" fill="#bfdbfe" font-size="18" font-family="sans-serif">project-baseline · 按 Skill 规则执行 · 不是已完成证明</text><rect x="38" y="171" width="1324" height="70" rx="16" fill="#ccfbf1"/><text x="65" y="197" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">核心目标</text><text x="65" y="220" fill="#334155" font-size="18" font-family="sans-serif">仅冻结已确认工程约束；容量分项只计一次，附决策来源和批准信息；前置询问只在对话，不生成正式工作稿。</text><rect x="40" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="305" r="22" fill="#0f766e"/><text x="73" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">1</text><text x="104" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">全量读取</text><text x="63" y="361" fill="#475569" font-size="16" font-family="sans-serif">PRD、原型、code、工程/环境/对接资</text><text x="63" y="382" fill="#475569" font-size="16" font-family="sans-serif">料</text><path d="M347,349 H369" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M364,342 L371,349 L364,356" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="377" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="305" r="22" fill="#0f766e"/><text x="410" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">2</text><text x="441" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">提取约束</text><text x="400" y="361" fill="#475569" font-size="16" font-family="sans-serif">批准事实、代码现状、建议；量化指标及禁令</text><path d="M684,349 H706" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M701,342 L708,349 L701,356" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="714" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="747" cy="305" r="22" fill="#0f766e"/><text x="747" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">3</text><text x="778" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">动态预填</text><text x="737" y="361" fill="#475569" font-size="16" font-family="sans-serif">8 类通用维度＋实际触发的专项/独有项</text><path d="M1021,349 H1043" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M1038,342 L1045,349 L1038,356" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="1051" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="1084" cy="305" r="22" fill="#0f766e"/><text x="1084" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">4</text><text x="1115" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">仅问缺口</text><text x="1074" y="361" fill="#475569" font-size="16" font-family="sans-serif">给出推荐与计算依据，由责任人裁定</text><rect x="40" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="492" r="22" fill="#0f766e"/><text x="73" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">5</text><text x="104" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">数值一致性闭合</text><text x="63" y="548" fill="#475569" font-size="16" font-family="sans-serif">负载↔资源、保留↔容量、RPO/RTO↔备</text><text x="63" y="569" fill="#475569" font-size="16" font-family="sans-serif">份</text><path d="M347,536 H369" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M364,529 L371,536 L364,543" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="377" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="492" r="22" fill="#0f766e"/><text x="410" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">6</text><text x="441" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">六关卡审核定稿</text><text x="400" y="548" fill="#475569" font-size="16" font-family="sans-serif">只写可判定的工程硬边界</text><rect x="38" y="667" width="1324" height="58" rx="14" fill="#e2e8f0"/><text x="65" y="689" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">审核与回退</text><text x="65" y="714" fill="#334155" font-size="17" font-family="sans-serif">是否有来源、指标值/单位/口径、可判定禁止项及批准结论？</text></svg>