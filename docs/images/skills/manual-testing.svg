<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-label="manual-testing的执行流程图"><rect width="1400" height="750" fill="#f8fafc"/><rect x="24" y="24" width="1352" height="125" rx="22" fill="#0f172a"/><text x="62" y="80" fill="#fff" font-size="32" font-weight="700" font-family="sans-serif">独立生成测试单、人工执行回填及任务签收</text><text x="62" y="119" fill="#bfdbfe" font-size="18" font-family="sans-serif">manual-testing · 按 Skill 规则执行 · 不是已完成证明</text><rect x="38" y="171" width="1324" height="70" rx="16" fill="#ccfbf1"/><text x="65" y="197" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">核心目标</text><text x="65" y="220" fill="#334155" font-size="18" font-family="sans-serif">真实自动化证据→四类覆盖判定→只生成人工必要用例→人实际执行→同用例复测→双角色签收。</text><rect x="40" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="305" r="22" fill="#0f766e"/><text x="73" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">1</text><text x="104" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">核对自动证据</text><text x="63" y="361" fill="#475569" font-size="16" font-family="sans-serif">读取本任务场景、TDD/API/浏览器/R</text><text x="63" y="382" fill="#475569" font-size="16" font-family="sans-serif">eview实际输出</text><path d="M347,349 H369" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M364,342 L371,349 L364,356" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="377" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="305" r="22" fill="#0f766e"/><text x="410" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">2</text><text x="441" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">四类覆盖分类</text><text x="400" y="361" fill="#475569" font-size="16" font-family="sans-serif">已自动覆盖/应补自动化/必须人测/受阻</text><path d="M684,349 H706" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M701,342 L708,349 L701,356" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="714" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="747" cy="305" r="22" fill="#0f766e"/><text x="747" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">3</text><text x="778" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">生成待测单</text><text x="737" y="361" fill="#475569" font-size="16" font-family="sans-serif">角色/前置数据/步骤/通过标准；实际结果留</text><text x="737" y="382" fill="#475569" font-size="16" font-family="sans-serif">空</text><path d="M1021,349 H1043" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M1038,342 L1045,349 L1038,356" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="1051" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="1084" cy="305" r="22" fill="#0f766e"/><text x="1084" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">4</text><text x="1115" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">人执行并回填</text><text x="1074" y="361" fill="#475569" font-size="16" font-family="sans-serif">开发/测试人员在真实环境验证并填写证据</text><rect x="40" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="492" r="22" fill="#0f766e"/><text x="73" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">5</text><text x="104" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">失败→Bug→原用例复测</text><text x="63" y="548" fill="#475569" font-size="16" font-family="sans-serif">按原版diagnosing-bugs修复，</text><text x="63" y="569" fill="#475569" font-size="16" font-family="sans-serif">保留首次失败记录</text><path d="M347,536 H369" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M364,529 L371,536 L364,543" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="377" y="457" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="492" r="22" fill="#0f766e"/><text x="410" y="499" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">6</text><text x="441" y="495" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">签收与状态更新</text><text x="400" y="548" fill="#475569" font-size="16" font-family="sans-serif">技术+业务签收后增量更新项目总控</text><rect x="38" y="667" width="1324" height="58" rx="14" fill="#e2e8f0"/><text x="65" y="689" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">审核与回退</text><text x="65" y="714" fill="#334155" font-size="17" font-family="sans-serif">每个关键场景有真实自动覆盖或人工通过证据，失败/受阻已经解决？</text></svg>