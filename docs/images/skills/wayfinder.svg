<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-label="wayfinder的执行流程图"><rect width="1400" height="750" fill="#f8fafc"/><rect x="24" y="24" width="1352" height="125" rx="22" fill="#0f172a"/><text x="62" y="80" fill="#fff" font-size="32" font-weight="700" font-family="sans-serif">通用工具 · 大型未知项目决策地图</text><text x="62" y="119" fill="#bfdbfe" font-size="18" font-family="sans-serif">wayfinder · 按 Skill 规则执行 · 不是已完成证明</text><rect x="38" y="171" width="1324" height="70" rx="16" fill="#dbeafe"/><text x="65" y="197" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">核心目标</text><text x="65" y="220" fill="#334155" font-size="18" font-family="sans-serif">目标清楚但路线不明确、跨多会话的大型工作，建立Map并逐张解决决策Ticket；不取代模块拆分。</text><rect x="40" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="73" cy="305" r="22" fill="#2563eb"/><text x="73" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">1</text><text x="104" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">步骤 1</text><text x="63" y="361" fill="#475569" font-size="16" font-family="sans-serif">确定最终Destination与规划边界</text><path d="M347,349 H369" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M364,342 L371,349 L364,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="377" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="305" r="22" fill="#2563eb"/><text x="410" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">2</text><text x="441" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">步骤 2</text><text x="400" y="361" fill="#475569" font-size="16" font-family="sans-serif">建立Map和Research/Protot</text><text x="400" y="382" fill="#475569" font-size="16" font-family="sans-serif">ype/Grilling/Task决策票及</text><text x="400" y="403" fill="#475569" font-size="16" font-family="sans-serif">阻塞</text><path d="M684,349 H706" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M701,342 L708,349 L701,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="714" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="747" cy="305" r="22" fill="#2563eb"/><text x="747" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">3</text><text x="778" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">步骤 3</text><text x="737" y="361" fill="#475569" font-size="16" font-family="sans-serif">每个会话解决一张决策票并扩展可见前沿</text><path d="M1021,349 H1043" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><path d="M1038,342 L1045,349 L1038,356" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="1051" y="270" width="305" height="158" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="1084" cy="305" r="22" fill="#2563eb"/><text x="1084" y="312" fill="#fff" text-anchor="middle" font-size="20" font-weight="700" font-family="sans-serif">4</text><text x="1115" y="308" fill="#0f172a" font-size="20" font-weight="700" font-family="sans-serif">步骤 4</text><text x="1074" y="361" fill="#475569" font-size="16" font-family="sans-serif">全部决策清晰时交给to-spec</text><rect x="38" y="667" width="1324" height="58" rx="14" fill="#e2e8f0"/><text x="65" y="689" fill="#1e293b" font-size="17" font-weight="700" font-family="sans-serif">审核与回退</text><text x="65" y="714" fill="#334155" font-size="17" font-family="sans-serif">抵达目标前的关键决策是否已全部解决？</text></svg>