<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1130" role="img" aria-labelledby="title desc">
<title id="title">整体架构设计 Skill：总体组件架构与关键端到端业务链路双核心流程图</title>
<desc id="desc">从需求、基线、代码输入，到关键链路筛选、反推组件、内部Grill、深化与双向校验、资源部署及A/B/C架构冻结和两轮审核。</desc>
<defs><linearGradient id="hd" x2="1" y2="1"><stop stop-color="#103a6a"/><stop offset="1" stop-color="#2d70ad"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#618ebf"/></marker></defs>
