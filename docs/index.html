<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="标准项目首次建设研发导航：阶段、步骤、Skill、输入、输出与审核。">
  <title>标准项目研发导航</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-brand">
      <span class="logo" aria-hidden="true">◇</span>
      <div><strong>项目研发导航</strong><span class="brand-sub">首次项目建设 · Grill / TDD / 人工验收</span></div>
    </div>
    <span id="project-stats" class="header-meta">正在载入流程…</span>
    <a id="download-skills" class="download-all" href="./skills-bundle.zip" download="标准项目-完整Skills包.zip" title="下载完整Skills与通用依赖（不含项目示例）">⬇ 下载全部 Skills</a>
  </header>
  <div class="workspace">
    <aside class="phase-pane" aria-label="工作阶段">
      <div class="pane-heading"><span class="eyebrow">WORK STAGES</span><h2>工作阶段</h2><p>选择阶段查看研发步骤</p></div>
      <nav id="stage-list" class="stage-list" aria-label="选择工作阶段"></nav>
      <div class="pane-foot">范围：首次项目建设<br>从现有 PRD、前端原型、后端框架开始</div>
    </aside>
    <main class="steps-pane" id="steps-pane">
      <div class="eyebrow">EXECUTION STEPS</div>
      <div id="stage-intro"></div>
      <div id="phase-route" class="phase-route" aria-label="本阶段流程图"></div>
      <div class="step-heading"><h2 id="step-heading-title">执行步骤</h2><span id="step-count"></span></div>
      <div id="step-list" class="step-list"></div>
      <div class="step-notice">实现步骤内置 TDD 和代码审查，并据自动测试证据生成待人工测试单；人工真实执行及回填后按需修复Bug、完成迭代收口。</div>
    </main>
    <aside class="detail-pane" aria-label="步骤详情">
      <div class="detail-top"><span class="eyebrow">STEP DETAILS</span><span id="step-position" class="step-number"></span></div>
      <div id="step-detail"></div>
    </aside>
  </div>
  <dialog id="skill-dialog" class="skill-dialog" aria-label="Skill内容预览">
    <div class="skill-dialog-shell">
      <div class="skill-dialog-header">
        <div><span class="eyebrow">SKILL EXPLORER</span><h2 id="skill-dialog-title">Skill 预览</h2><div id="skill-dialog-label" class="skill-meta"></div></div>
        <button type="button" class="dialog-close" data-skill-close aria-label="关闭Skill预览">✕</button>
      </div>
      <div class="skill-dialog-tabs" role="tablist">
        <button type="button" class="skill-tab active" data-skill-tab="flow">快速理解</button>
        <button type="button" class="skill-tab" data-skill-tab="result" hidden>报价项目输出示例</button>
        <button type="button" class="skill-tab" data-skill-tab="files">完整目录与文件</button>
        <button type="button" class="skill-tab" data-skill-tab="source">参考来源说明</button>
      </div>
      <div id="skill-dialog-content" class="skill-dialog-content"></div>
      <div class="skill-dialog-footer"><div id="skill-reference"></div><button class="dialog-close-bottom" type="button" data-skill-close>关闭</button></div>
    </div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
